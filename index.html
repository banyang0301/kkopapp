<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>꼽난지원금</title>
<style>
  /* 기존 CSS 그대로 (변경 없음) */
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e9eef5;color:#111827;}
  .app{max-width:420px;min-height:100vh;margin:0 auto;padding:18px 16px 28px;background:linear-gradient(180deg,#eef3f9 0%, #e6edf6 100%);}
  /* ... (중간 CSS 전체 생략 - 이전 코드와 동일) ... */
  .btn-light{background:#edf2f8;color:#334155;}
  /* ... 기존 CSS 끝 ... */
</style>
</head>
<body>
  <div class="app">
    <!-- 기존 HTML 그대로 -->
    <div class="topbar">
      <div class="bank">KKOB SEO BANK</div>
      <button class="share-btn" onclick="shareResult()">공유</button>
    </div>
    <div class="hero">…</div>  <!-- hero 부분 생략 -->
    <div class="panel">
      <!-- input, button 등 생략 -->
      <div id="result"></div>
      <!-- actions 생략 -->
    </div>
  </div>

<script>
// 기존 변수 및 함수들 그대로 유지 (amountOptions, rand, getNowText 등)

let data = null;

// ... (기존 check(), pay(), toggleReceipt(), resetAll(), shareResult() 함수 그대로)

// ==================== 새로 추가된 명세서 공유 함수 ====================
async function shareReceipt(){
  if(!data) {
    alert("먼저 지원금을 받아주세요!");
    return;
  }

  const shareText = `${data.owner} 꼽난지원금 입금 완료 🎉

🧾 명세서
• 지급 금액 : ${data.amountLabel}
• 원화 환산 : ${data.krw.toLocaleString()}원
• 현재 잔액 : ${data.balance.toLocaleString()}원
• 입금 계좌 : ${data.account}
• 거래 시각 : ${data.approvedAt}
• 거래 번호 : ${data.receiptNo}

꼽좀그만주쎠 😂
#꼽난지원금 #KKOBSEO_BANK`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "꼽난지원금 명세서",
        text: shareText,
        url: window.location.href
      });
    } else {
      await navigator.clipboard.writeText(shareText);
      alert("명세서가 클립보드에 복사되었습니다!\nThreads에 바로 붙여넣기 하세요.");
    }
  } catch(e) {
    alert("공유에 실패했습니다.");
  }
}

// ==================== pay() 함수 수정 (명세서 안에 공유 버튼 추가) ====================
function pay(){
  if(!data){
    alert("먼저 자격 확인을 해주세요.");
    return;
  }
  document.getElementById("result").innerHTML = `
    <div class="success">
      <div class="success-top">
        <div class="success-chip">입금 완료</div>
        <h2 class="success-title">꼽난지원금 지급 성공</h2>
      </div>
      <div class="success-body">
        <div class="transfer-box">
          <div class="transfer-amount">${data.amountLabel}</div>
          <div class="transfer-desc">
            ${data.owner} 명의의 계좌로 정상 입금되었습니다.<br>
            입금 계좌 ${data.account}<br>
            현재 잔액 ${data.balance.toLocaleString()}원<br>
            꼽좀그만주쎠
          </div>
        </div>
        
        <button id="receiptToggleBtn" class="btn btn-primary" style="margin-top:14px;" onclick="toggleReceipt(event)">
          명세서 보기
        </button>
        
        <div class="receipt" id="receiptBox" style="display:none;">
          <div class="receipt-title">거래 명세서</div>
          <div class="row"><div class="row-label">입금 계좌</div><div class="row-value">${data.account}</div></div>
          <div class="row"><div class="row-label">예금주</div><div class="row-value">${data.owner}</div></div>
          <div class="row"><div class="row-label">현재 잔액</div><div class="row-value">${data.balance.toLocaleString()}원</div></div>
          <div class="row"><div class="row-label">지급 금액</div><div class="row-value">${data.amountLabel}</div></div>
          <div class="row"><div class="row-label">원화 환산</div><div class="row-value">${data.krw.toLocaleString()}원</div></div>
          <div class="row"><div class="row-label">거래 시각</div><div class="row-value">${data.approvedAt}</div></div>
          <div class="row"><div class="row-label">거래 번호</div><div class="row-value">${data.receiptNo}</div></div>
          
          <!-- ⭐⭐⭐ 새로 추가된 명세서 공유 버튼 ⭐⭐⭐ -->
          <button onclick="shareReceipt()" class="btn btn-light" style="margin-top:14px;width:100%;font-size:15px;">
            📤 명세서 공유하기
          </button>
        </div>

        <div class="footer-note">
          꼽난지원금의 화폐가치는 환산 기준에 따라 원화로 표시됩니다.
        </div>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
